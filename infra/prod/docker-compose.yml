services:
  # There is no migrate service, deliberately. Migrations run in-process on
  # API boot (internal/database/migrations.go, called from cmd/api/main.go),
  # unconditionally, before the HTTP server starts accepting traffic. A
  # standalone migrate container that checks for a "schema file" is not part
  # of this app's design — see docs/MIGRATIONS.md in the app repo.
  api:
    image: ghcr.io/thewisdomchurch/wisdom-api:main
    container_name: wisdom_api
    restart: always
    env_file:
      - .env.production
    ports:
      - "8080:8080"
    # SMTP_HOST=host.docker.internal routes outbound mail through a relay
    # running on the host machine itself. That hostname only resolves inside
    # the container because of this mapping — without it, every outbound
    # email fails with "lookup host.docker.internal: no such host" before
    # the SMTP handshake ever starts (this was the actual cause of a
    # production incident: marketing/campaign and transactional emails were
    # both silently failing). Requires Docker Engine 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
