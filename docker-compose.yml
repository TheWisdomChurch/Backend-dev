services:
  postgres:
    image: postgres:15-alpine
    container_name: wisdom_church_backend
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DBNAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ❌ REMOVE init.sql mount (migrations own schema)
      # - ./script/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wisdom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ✅ One-off migration runner (versioned migrations)
  migrate:
    image: migrate/migrate:4
    container_name: wisdom_church_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - wisdom_network
    entrypoint: [
      "migrate",
      "-path", "/migrations",
      "-database",
      "postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_DBNAME}?sslmode=disable",
      "up"
    ]

  redis:
    image: redis:7-alpine
    container_name: wisdom_church_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - wisdom_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development  # dev stage with hot reload
    container_name: wisdom_church_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/tmp
      - /app/.git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ✅ If you want API to wait until migrations finish,
      # don't depend_on migrate (compose doesn't track completion well).
      # Instead run migrations explicitly before `up` (commands below).
    networks:
      - wisdom_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  wisdom_network:
    driver: bridge
