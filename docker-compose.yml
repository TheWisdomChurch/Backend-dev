version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: wisdom_church_backend
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DBNAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations own schema — keep init.sql disabled
      # - ./script/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wisdom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ✅ One-off migration runner (supports up/down/version/goto/etc.)
  migrate:
    image: migrate/migrate:v4.16.2
    container_name: wisdom_church_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - wisdom_network
    entrypoint: ["migrate"]
    command: ["-path", "/migrations", "-database", "postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_DBNAME}?sslmode=disable", "up"]
    environment:
      # Convenience vars so you don't repeat yourself
      MIGRATIONS_PATH: /migrations
      DATABASE_URL: postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_DBNAME}?sslmode=disable
    # Runs migrations on startup; container exits after completion

  redis:
    image: redis:7-alpine
    container_name: wisdom_church_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - wisdom_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: development
    container_name: wisdom_church_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/tmp
      - /app/.git
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - wisdom_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  wisdom_network:
    driver: bridge
